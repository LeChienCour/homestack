# =============================================================================
# Homestack — Compose principal
# =============================================================================
# Compatible con podman-compose y docker-compose
# Uso: podman-compose up -d

version: "3.9"

networks:
  proxy:
    name: homestack-proxy
  internal:
    name: homestack-internal
    internal: false  # Cambiar a true después de validar conectividad

volumes:
  # Datos persistentes — sobreviven a recreación de containers
  postgres_data:
  redis_data:
  traefik_data:
  n8n_data:
  listmonk_uploads:
  docuseal_data:
  postiz_uploads:
  vaultwarden_data:
  umami_data:
  beszel_data:
  vikunja_files:
  opensearch_data:
  homepage_logs:

services:

  # ---------------------------------------------------------------------------
  # INFRAESTRUCTURA
  # ---------------------------------------------------------------------------

  # Traefik: reverse proxy. Recibe tráfico de cloudflared y lo enruta por hostname.
  traefik:
    build: ./traefik
    container_name: traefik
    restart: unless-stopped
    security_opt:
      - label=disable
    deploy:
      resources:
        limits:
          memory: 128m
    networks:
      - proxy
    command:
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=homestack-proxy"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--entrypoints.web.address=:80"
      - "--log.level=INFO"
      - "--accesslog=true"
    ports:
      # Solo escucha en localhost (127.0.0.1), no expone al exterior.
      # Cloudflared se conecta internamente.
      - "127.0.0.1:8080:8080"  # Dashboard Traefik
    volumes:
      - /run/user/501/podman/podman.sock:/var/run/docker.sock:ro
      - traefik_data:/data

  # Cloudflared: tunnel a Cloudflare. Sin puertos abiertos en el Mac mini.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64m
    networks:
      - proxy
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - traefik

  # Postgres compartido. Cada app tiene su propia DB.
  postgres:
    build: ./postgres
    container_name: postgres
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
    networks:
      - internal
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis para Postiz (queue de publicaciones)
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m   # --maxmemory 256mb ya configurado en command
    networks:
      - internal
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--pass", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # APLICACIONES
  # ---------------------------------------------------------------------------

  # n8n: automatización de flujos (reemplaza Zapier)
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
    networks:
      - proxy
      - internal
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_HOST: n8n.${DOMAIN}
      N8N_PROTOCOL: https
      N8N_PORT: 5678
      N8N_EDITOR_BASE_URL: https://n8n.${DOMAIN}
      N8N_PROXY_HOPS: "1"
      WEBHOOK_URL: https://n8n.${DOMAIN}/
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_USER_MANAGEMENT_JWT_SECRET: ${N8N_USER_MANAGEMENT_JWT_SECRET}
      GENERIC_TIMEZONE: ${TZ}
      TZ: ${TZ}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.n8n.rule=Host(`n8n.${DOMAIN}`)"
      - "traefik.http.routers.n8n.entrypoints=web"
      - "traefik.http.services.n8n.loadbalancer.server.port=5678"

  # Listmonk: email marketing self-hosted (reemplaza Mailchimp)
  listmonk:
    image: listmonk/listmonk:latest
    container_name: listmonk
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
    networks:
      - proxy
      - internal
    environment:
      LISTMONK_app__address: 0.0.0.0:9000
      LISTMONK_db__host: postgres
      LISTMONK_db__port: 5432
      LISTMONK_db__user: ${POSTGRES_USER}
      LISTMONK_db__password: ${POSTGRES_PASSWORD}
      LISTMONK_db__database: listmonk
      LISTMONK_db__ssl_mode: disable
      LISTMONK_ADMIN_USER: ${LISTMONK_ADMIN_USER}
      LISTMONK_ADMIN_PASSWORD: ${LISTMONK_ADMIN_PASSWORD}
      TZ: ${TZ}
    volumes:
      - listmonk_uploads:/listmonk/uploads
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.listmonk.rule=Host(`mail.${DOMAIN}`)"
      - "traefik.http.routers.listmonk.entrypoints=web"
      - "traefik.http.services.listmonk.loadbalancer.server.port=9000"

  # Docuseal: firma electrónica (reemplaza DocuSign)
  docuseal:
    image: docuseal/docuseal:latest
    container_name: docuseal
    restart: unless-stopped
    networks:
      - proxy
      - internal
    environment:
      HOST: sign.${DOMAIN}
      FORCE_SSL: "true"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/docuseal
      SECRET_KEY_BASE: ${DOCUSEAL_SECRET_KEY_BASE}
      TZ: ${TZ}
    volumes:
      - docuseal_data:/data
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.docuseal.rule=Host(`sign.${DOMAIN}`)"
      - "traefik.http.routers.docuseal.entrypoints=web"
      - "traefik.http.services.docuseal.loadbalancer.server.port=3000"

  # Postiz: gestión de redes sociales (reemplaza Buffer)
  # OpenSearch: advanced visibility para Temporal (requerido por Postiz)
  opensearch:
    image: opensearchproject/opensearch:2.11.0
    container_name: opensearch
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768m
    networks:
      - internal
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - "OPENSEARCH_JAVA_OPTS=-Xms256m -Xmx256m"
    volumes:
      - opensearch_data:/usr/share/opensearch/data

  # Temporal: workflow engine requerido por Postiz
  temporal:
    build: ./temporal
    container_name: temporal
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
    networks:
      - internal
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PWD=${POSTGRES_PASSWORD}
      - POSTGRES_SEEDS=postgres
      - ENABLE_ES=true
      - ES_SEEDS=opensearch
      - ES_VERSION=v7
      - ES_SCHEME=http
      - ES_PORT=9200
      - TEMPORAL_NAMESPACE=default
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_started

  postiz:
    image: ghcr.io/gitroomhq/postiz-app:latest
    container_name: postiz
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1536m
    networks:
      - proxy
      - internal
    environment:
      MAIN_URL: ${POSTIZ_MAIN_URL}
      FRONTEND_URL: ${POSTIZ_FRONTEND_URL}
      NEXT_PUBLIC_BACKEND_URL: ${POSTIZ_MAIN_URL}/api
      JWT_SECRET: ${POSTIZ_JWT_SECRET}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/postiz
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      TEMPORAL_ADDRESS: temporal:7233
      IS_GENERAL: "true"
      STORAGE_PROVIDER: local
      UPLOAD_DIRECTORY: /uploads
      NEXT_PUBLIC_UPLOAD_DIRECTORY: /uploads
      TZ: ${TZ}
    volumes:
      - postiz_uploads:/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      temporal:
        condition: service_started
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.postiz.rule=Host(`social.${DOMAIN}`)"
      - "traefik.http.routers.postiz.entrypoints=web"
      - "traefik.http.services.postiz.loadbalancer.server.port=5000"

  # Vaultwarden: gestor de contraseñas (reemplaza Bitwarden)
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    networks:
      - proxy
    environment:
      DOMAIN: https://vault.${DOMAIN}
      SIGNUPS_ALLOWED: ${VAULTWARDEN_SIGNUPS_ALLOWED}
      ADMIN_TOKEN: ${VAULTWARDEN_ADMIN_TOKEN}
      WEBSOCKET_ENABLED: "true"
      TZ: ${TZ}
    volumes:
      - vaultwarden_data:/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vaultwarden.rule=Host(`vault.${DOMAIN}`)"
      - "traefik.http.routers.vaultwarden.entrypoints=web"
      - "traefik.http.services.vaultwarden.loadbalancer.server.port=80"

  # Umami: web analytics (reemplaza Google Analytics)
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: umami
    restart: unless-stopped
    networks:
      - proxy
      - internal
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/umami
      DATABASE_TYPE: postgresql
      APP_SECRET: ${UMAMI_APP_SECRET}
      TZ: ${TZ}
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.umami.rule=Host(`stats.${DOMAIN}`)"
      - "traefik.http.routers.umami.entrypoints=web"
      - "traefik.http.services.umami.loadbalancer.server.port=3000"

  # Vikunja: gestión de proyectos/tickets (kanban + subtareas)
  vikunja:
    image: vikunja/vikunja:latest
    container_name: vikunja
    restart: unless-stopped
    networks:
      - proxy
      - internal
    environment:
      VIKUNJA_SERVICE_PUBLICURL: https://tasks.${DOMAIN}
      VIKUNJA_DATABASE_TYPE: postgres
      VIKUNJA_DATABASE_HOST: postgres
      VIKUNJA_DATABASE_DATABASE: vikunja
      VIKUNJA_DATABASE_USER: ${POSTGRES_USER}
      VIKUNJA_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      VIKUNJA_SERVICE_JWTSECRET: ${VIKUNJA_JWT_SECRET}
      VIKUNJA_SERVICE_TIMEZONE: ${TZ}
      # Solo tú: deshabilita registro público tras crear tu cuenta
      VIKUNJA_SERVICE_ENABLEREGISTRATION: "true"
    volumes:
      - vikunja_files:/app/vikunja/files
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vikunja.rule=Host(`tasks.${DOMAIN}`)"
      - "traefik.http.routers.vikunja.entrypoints=web"
      - "traefik.http.services.vikunja.loadbalancer.server.port=3456"

  # SocialTrace: tracking local-first de redes sociales (repo hermano ../socialtrace)
  # Backend/frontend usan el Postgres compartido; caddy interno del proyecto
  # se conserva para el routing /api → backend, resto → frontend, y es el
  # único servicio expuesto a Traefik. No se usa el backup sidecar propio de
  # socialtrace: backup.sh de homestack ya hace pg_dumpall de la DB socialtrace.
  socialtrace-backend:
    build: ../../socialtrace/backend
    container_name: socialtrace-backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
    networks:
      internal:
        aliases:
          - backend
    environment:
      SOCIALTRACE_POSTGRES_HOST: postgres
      SOCIALTRACE_POSTGRES_PORT: "5432"
      SOCIALTRACE_POSTGRES_DB: socialtrace
      SOCIALTRACE_POSTGRES_USER: ${POSTGRES_USER}
      SOCIALTRACE_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SOCIALTRACE_API_TOKEN: ${SOCIALTRACE_API_TOKEN}
      SOCIALTRACE_ENVIRONMENT: production
    command: ["sh", "-c", "alembic upgrade head && uvicorn socialtrace.main:app --host 0.0.0.0 --port 8000"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  socialtrace-frontend:
    build: ../../socialtrace/frontend
    container_name: socialtrace-frontend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128m
    networks:
      internal:
        aliases:
          - frontend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  socialtrace-caddy:
    build: ../../socialtrace/caddy
    container_name: socialtrace-caddy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64m
    networks:
      - proxy
      - internal
    depends_on:
      socialtrace-backend:
        condition: service_healthy
      socialtrace-frontend:
        condition: service_started
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.socialtrace.rule=Host(`track.${DOMAIN}`)"
      - "traefik.http.routers.socialtrace.entrypoints=web"
      - "traefik.http.services.socialtrace.loadbalancer.server.port=8080"

  # ---------------------------------------------------------------------------
  # OBSERVABILIDAD
  # ---------------------------------------------------------------------------

  # Homepage: dashboard único con todos los servicios
  homepage:
    build: ./homepage
    container_name: homepage
    restart: unless-stopped
    networks:
      - proxy
    environment:
      HOMEPAGE_ALLOWED_HOSTS: home.${DOMAIN}
      HOMEPAGE_VAR_DOMAIN: ${DOMAIN}
      TZ: ${TZ}
    volumes:
      - homepage_logs:/app/config/logs
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.homepage.rule=Host(`home.${DOMAIN}`)"
      - "traefik.http.routers.homepage.entrypoints=web"
      - "traefik.http.services.homepage.loadbalancer.server.port=3000"

  # Beszel: monitoring de host + containers
  beszel:
    image: henrygd/beszel:latest
    container_name: beszel
    restart: unless-stopped
    networks:
      - proxy
    volumes:
      - beszel_data:/beszel_data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.beszel.rule=Host(`metrics.${DOMAIN}`)"
      - "traefik.http.routers.beszel.entrypoints=web"
      - "traefik.http.services.beszel.loadbalancer.server.port=8090"

  # Beszel agent: corre en el host para reportar métricas
  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: beszel-agent
    restart: unless-stopped
    security_opt:
      - label=disable
    network_mode: host
    environment:
      PORT: 45876
      KEY: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILnp2ZtjdLnPXZi/ZIzyQu5WWz8MfFi3EazG8xRv0xhA"  # Se obtiene del UI de Beszel al agregar el sistema
    volumes:
      - /run/user/501/podman/podman.sock:/var/run/docker.sock:ro

  # Dozzle: logs en tiempo real de todos los containers
  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    restart: unless-stopped
    security_opt:
      - label=disable
    networks:
      - proxy
    environment:
      DOZZLE_NO_ANALYTICS: "true"
      TZ: ${TZ}
    volumes:
      - /run/user/501/podman/podman.sock:/var/run/docker.sock:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dozzle.rule=Host(`logs.${DOMAIN}`)"
      - "traefik.http.routers.dozzle.entrypoints=web"
      - "traefik.http.services.dozzle.loadbalancer.server.port=8080"
